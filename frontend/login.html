<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light"><meta name="theme-color" content="#173f35"><meta name="referrer" content="same-origin">

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header"><div class="header-content"><div class="brand"><img src="/mark.svg" alt=""><span>prs-agent</span></div><span class="brand-line">Genetics, with context.</span></div></header>
    <main id="main" class="login-main" tabindex="-1">
      <div class="login-intro"><p class="section-label">A conversation with your DNA</p><h1>Genetics,<br>with context.</h1><p class="intro-deck">An answer means more when you understand where it comes from.</p><span class="login-flourish" aria-hidden="true"></span></div>
      <form id="login-form" class="login-form"><h2>Welcome back.</h2><p>Sign in with the shared password from Adam.</p><label for="password">Today’s password</label><input id="password" name="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="128" required disabled><p id="login-message" class="field-help" role="status" aria-live="polite">Connecting…</p><button class="button wide" id="login-submit" type="submit" disabled>Sign in <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button><button class="text-button" id="login-retry" type="button" hidden>Try again</button></form>
    </main>
    <footer class="site-footer login-footer"><p>Research tool. Not medical advice.</p></footer>
    <noscript>JavaScript is needed to sign in.</noscript>
  </body>
