# The demo's public front door (DEMO-README.md, "A public link through a front door"): HTTPS
# for @NAME@ with a Let's Encrypt certificate, passed over Tailscale to the demo's own HTTPS
# front (demo_site/tls_proxy.py) on the demo host, whose self-signed certificate, pinned here,
# is the only one this proxy accepts from it.
#
#   @NAME@           the public name, whose A record points at this machine
#   @UPSTREAM@       the demo host's tailnet ADDRESS:PORT, where its front listens
#   @UPSTREAM_NAME@  the name the demo host's certificate is for
#   @PIN@            a copy of that certificate on this machine

limit_req_zone $binary_remote_addr zone=prs_demo:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=prs_demo_conn:10m;

# Any other name, or none: no TLS handshake on 443 and no answer on 80.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name @NAME@;
    server_tokens off;
    # Let's Encrypt's HTTP-01 checks, for the certificate and each renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @NAME@;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/@NAME@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@NAME@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:prs_demo_tls:10m;
    ssl_session_tickets off;

    # A request body other than an upload is small (the web takes 64 KiB at most) and stays in
    # memory here, never in a file.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 60s;
    # Per visitor address. One open demo page polls every 2 s; loading it is about a dozen
    # requests at once.
    limit_req zone=prs_demo burst=80 nodelay;
    limit_req_status 429;
    limit_conn prs_demo_conn 30;

    # Every request goes to the demo host, whose certificate is the pinned one.
    proxy_ssl_name @UPSTREAM_NAME@;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 1;
    proxy_ssl_trusted_certificate @PIN@;
    proxy_ssl_protocols TLSv1.3;
    # The demo checks Host against its origins. X-Forwarded-For is the visitor's address
    # alone, never what the browser sent; the demo's front keeps it from this machine only.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    # Answers in memory too, never in a temporary file here.
    proxy_buffers 32 256k;
    proxy_busy_buffers_size 512k;
    proxy_max_temp_file_size 0;
    # The demo host can't be reached (nginx's own 502 or 504) or says its demo is down (its
    # front's 503): the offline page. Its other answers, errors included, pass as they are.
    # Each request still goes to the demo host first, and a lone server is never marked
    # down, so the demo is back by itself as soon as the host is.
    proxy_intercept_errors on;
    error_page 502 503 504 = @offline;

    location / {
        proxy_pass https://@UPSTREAM@;
    }

    # A run's private link carries its secret in the path: never written to the access log.
    location ^~ /r/ {
        access_log off;
        proxy_pass https://@UPSTREAM@;
    }

    # An upload goes on to the demo host as it arrives, a buffer at a time: never whole in
    # memory or in a file here, and what the visitor's browser shows sent is what the demo host
    # has. The web's limit is 1 GiB, a whole genome, and it gives an upload the time its size
    # needs at 1 Mbit/s; a visitor's link that stalls for client_body_timeout is let go.
    location = /api/run {
        proxy_pass https://@UPSTREAM@;
        client_max_body_size 1025m;
        client_body_buffer_size 1m;
        proxy_request_buffering off;
    }

    # A plain page from this machine, needing nothing from the demo host. It loads the address
    # again every minute, which opens the demo once it is back.
    location @offline {
        types { }
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 503 '<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Demo offline · prs-agent</title>
<style>
body { margin: 0; background: #f7f7f0; color: #293e35; font: 17px/1.5 system-ui, sans-serif; }
main { max-width: 36rem; margin: 15vh auto; padding: 0 16px; }
h1 { color: #173f35; font-size: 1.75rem; line-height: 1.2; margin: 0 0 12px; }
p { margin: 0 0 12px; }
.note { color: #52655b; font-size: 15px; }
</style>
</head>
<body>
<main>
<h1>The demo is offline right now.</h1>
<p>Please try again later.</p>
<p class="note">This page checks again every minute and opens the demo by itself once it is back.</p>
</main>
</body>
</html>
';
    }
}
